services:
  honeypot:
    image: honeymire-sensor-go:local
    build: .
    restart: unless-stopped
    environment:
      HONEYMIRE_HUB_URL: ${HONEYMIRE_HUB_URL:?set HONEYMIRE_HUB_URL}
      HONEYMIRE_TOKEN: ${HONEYMIRE_TOKEN:?set HONEYMIRE_TOKEN}
      HONEYMIRE_DEVICE_ID: ${HONEYMIRE_DEVICE_ID:-hp-vps}
      HONEYMIRE_BOARD: ${HONEYMIRE_BOARD:-docker-edge}
      HONEYMIRE_DISPLAY: ${HONEYMIRE_DISPLAY:-none}
      HONEYMIRE_TELNET_LISTEN: ${HONEYMIRE_TELNET_LISTEN:-:23}
      HONEYMIRE_SSH_LISTEN: ${HONEYMIRE_SSH_LISTEN:-:22}
      HONEYMIRE_DASHBOARD: ${HONEYMIRE_DASHBOARD:-:8080}
      HONEYMIRE_DASHBOARD_URL: ${HONEYMIRE_DASHBOARD_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      HONEYMIRE_DASHBOARD_AUTH: ${HONEYMIRE_DASHBOARD_AUTH:-}
      DASHBOARD_AUTH: ${DASHBOARD_AUTH:-}
      HONEYMIRE_CERT_CACHE: /data/certs
      HONEYMIRE_IP_COOLDOWN: ${HONEYMIRE_IP_COOLDOWN:-3m}
      HONEYMIRE_LOGIN_ATTEMPTS_BEFORE_ACCEPT: ${HONEYMIRE_LOGIN_ATTEMPTS_BEFORE_ACCEPT:-3}
    ports:
      - "80:80"
      - "443:443"
      - "23:23"
      - "22:22"
      - "8080:8080"
    volumes:
      - honeypot_state:/data

volumes:
  honeypot_state:
